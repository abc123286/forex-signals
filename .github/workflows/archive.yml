name: Price archive

on:
  schedule:
    - cron: "47 1 * * 6"          # every Saturday 01:47 UTC (9:47am Malaysia), market closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forex-signals            # never runs at the same time as the signal bot
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Add this week's prices to the history
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python archive.py

      - name: Save history
        run: |
          git config user.name "forex-bot"
          git config user.email "forex-bot@users.noreply.github.com"
          git add data/history
          if ! git diff --cached --quiet; then
            git commit -m "Weekly price archive"
            for attempt in 1 2 3 4; do
              git pull --rebase -X theirs && git push && break
              echo "Save clashed with another update, retrying ($attempt)..."
              sleep $((attempt * 5))
            done
          fi
